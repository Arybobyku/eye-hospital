; ══════════════════════════════════════════════════════════════════════════════
; Supervisor config — SatuSehat ALL Processes (GROUP)
; ══════════════════════════════════════════════════════════════════════════════
;
; File ini MENGGABUNGKAN keempat proses SatuSehat:
;   - pasien    : listener pg_notify INSERT pasien → sync patient ke SatuSehat
;   - registrasi: listener pg_notify INSERT/UPDATE registrasi → sync encounter
;   - careplan  : listener pg_notify UPDATE status_dokter → sync CarePlan
;   - queue     : Laravel queue worker — WAJIB karena QUEUE_CONNECTION=database
;
; PENTING — mengapa queue diperlukan:
;   Ketiga listener di atas hanya men-DISPATCH job ke tabel `jobs` (database queue).
;   Tanpa queue worker berjalan, job tidak pernah dieksekusi → API SatuSehat
;   tidak pernah dipanggil → satusehat_api_logs tetap kosong.
;
; ── Cara install di production (Ubuntu/Debian) ────────────────────────────────
;
;   1. sudo apt-get install supervisor
;
;   2. Hapus/nonaktifkan config lama jika ada:
;      sudo rm -f /etc/supervisor/conf.d/satusehat-listener.conf
;      sudo rm -f /etc/supervisor/conf.d/satusehat-registrasi-listener.conf
;      sudo rm -f /etc/supervisor/conf.d/satusehat-careplan-listener.conf
;
;   3. Copy file ini:
;      sudo cp satusehat-group.conf /etc/supervisor/conf.d/
;
;   4. Reload Supervisor:
;      sudo supervisorctl reread
;      sudo supervisorctl update
;
;   5. Pastikan trigger PostgreSQL sudah ter-deploy:
;      psql -U postgres -d rumah-sakit -c "SELECT tgname FROM pg_trigger WHERE tgname = 'trg_registrasi_upsert';"
;      Jika hasilnya kosong, jalankan: psql -U postgres -d rumah-sakit -f database/sql/satu-sehat.sql
;
; ── Perintah group (satu command untuk semua) ────────────────────────────────
;
;   Start semua  : sudo supervisorctl start satusehat:*
;   Stop semua   : sudo supervisorctl stop satusehat:*
;   Restart semua: sudo supervisorctl restart satusehat:*
;   Status semua : sudo supervisorctl status satusehat:*
;
; ── Perintah per-daemon ───────────────────────────────────────────────────────
;
;   sudo supervisorctl stop satusehat:pasien
;   sudo supervisorctl restart satusehat:registrasi
;   sudo supervisorctl status satusehat:careplan
;   sudo supervisorctl status satusehat:queue
;
; ── Lihat log ────────────────────────────────────────────────────────────────
;
;   tail -f /var/log/supervisor/satusehat-pasien.log
;   tail -f /var/log/supervisor/satusehat-registrasi.log
;   tail -f /var/log/supervisor/satusehat-careplan.log
;   tail -f /var/log/supervisor/satusehat-queue.log
;
; ── Ganti /var/www/eye-hospital dengan path project Laravel Anda ──────────────
; ══════════════════════════════════════════════════════════════════════════════


; ── Group definition ──────────────────────────────────────────────────────────
; Semua program di bawah akan tergabung dalam group bernama "satusehat"

[group:satusehat]
programs=pasien,registrasi,careplan,queue
priority=999


; ═════════════════════════════════════════════════════════════════════════════
; Program: pasien
; Trigger: INSERT ke tabel pasien → pg_notify satusehat_pasien_insert
; ═════════════════════════════════════════════════════════════════════════════

[program:pasien]
command=/usr/bin/php /var/www/eye-hospital/artisan satusehat:listen-pasien --timeout=5000 --max-jobs=1000
directory=/var/www/eye-hospital
user=www-data
autostart=true
autorestart=true
startretries=10
startsecs=3

stdout_logfile=/var/log/supervisor/satusehat-pasien.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/satusehat-pasien-error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3

stopsignal=TERM
stopwaitsecs=10


; ═════════════════════════════════════════════════════════════════════════════
; Program: registrasi
; Trigger: INSERT ke tabel registrasi → pg_notify satusehat_registrasi_upsert
; ═════════════════════════════════════════════════════════════════════════════

[program:registrasi]
command=/usr/bin/php /var/www/eye-hospital/artisan satusehat:listen-registrasi --timeout=5000 --max-jobs=1000
directory=/var/www/eye-hospital
user=www-data
autostart=true
autorestart=true
startretries=10
startsecs=3

stdout_logfile=/var/log/supervisor/satusehat-registrasi.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/satusehat-registrasi-error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3

stopsignal=TERM
stopwaitsecs=10


; ═════════════════════════════════════════════════════════════════════════════
; Program: careplan
; Trigger: UPDATE registrasi SET status_dokter = 'Sudah Diperiksa'
;          → pg_notify satusehat_careplan_notify
; ═════════════════════════════════════════════════════════════════════════════

[program:careplan]
command=/usr/bin/php /var/www/eye-hospital/artisan satusehat:listen-careplan --timeout=5000 --max-jobs=1000
directory=/var/www/eye-hospital
user=www-data
autostart=true
autorestart=true
startretries=10
startsecs=3

stdout_logfile=/var/log/supervisor/satusehat-careplan.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/satusehat-careplan-error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3

stopsignal=TERM
stopwaitsecs=10


; ═════════════════════════════════════════════════════════════════════════════
; Program: queue
; Memproses job dari tabel `jobs` (QUEUE_CONNECTION=database)
; Job yang diproses: SyncEncounterToSatuSehat, SyncPasienToSatuSehat,
;                   SyncCarePlanToSatuSehat
;
; numprocs=2 → dua worker paralel agar tidak ada antrian panjang
; ═════════════════════════════════════════════════════════════════════════════

[program:queue]
command=/usr/bin/php /var/www/eye-hospital/artisan queue:work --queue=default --tries=3 --max-jobs=1000 --sleep=3
directory=/var/www/eye-hospital
user=www-data
autostart=true
autorestart=true
startretries=10
startsecs=3
numprocs=2
process_name=%(program_name)s_%(process_num)02d

stdout_logfile=/var/log/supervisor/satusehat-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/satusehat-queue-error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3

stopsignal=TERM
stopwaitsecs=30
