; ══════════════════════════════════════════════════════════════════════════════
; Supervisor config — SatuSehat Registrasi Listener Daemon
; ══════════════════════════════════════════════════════════════════════════════
;
; Cara install di production (Ubuntu/Debian):
;   1. sudo apt-get install supervisor
;   2. sudo cp satusehat-registrasi-listener.conf /etc/supervisor/conf.d/
;   3. sudo supervisorctl reread
;   4. sudo supervisorctl update
;   5. sudo supervisorctl start satusehat-registrasi-listener
;
; Cek status:
;   sudo supervisorctl status satusehat-registrasi-listener
;
; Lihat log:
;   tail -f /var/log/supervisor/satusehat-registrasi-listener.log
; ──────────────────────────────────────────────────────────────────────────────

[program:satusehat-registrasi-listener]

; ── Perintah daemon ───────────────────────────────────────────────────────────
; Ganti /var/www/eye-hospital dengan path project Laravel Anda
command=/usr/bin/php /var/www/eye-hospital/artisan satusehat:listen-registrasi --timeout=5000 --max-jobs=1000

; ── Working directory ─────────────────────────────────────────────────────────
directory=/var/www/eye-hospital

; ── User yang menjalankan proses ──────────────────────────────────────────────
; Gunakan user yang sama dengan web server (biasanya www-data)
user=www-data

; ── Auto-start dan restart ────────────────────────────────────────────────────
autostart=true
autorestart=true

; Restart jika exit code selain 0 (error) atau setelah --max-jobs tercapai
startretries=10
startsecs=3

; ── Logging ───────────────────────────────────────────────────────────────────
stdout_logfile=/var/log/supervisor/satusehat-registrasi-listener.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/satusehat-registrasi-listener-error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3

; ── Environment ───────────────────────────────────────────────────────────────
; Pastikan variabel .env terbaca (opsional jika sudah di system environment)
; environment=APP_ENV="production"

; ── Graceful shutdown ─────────────────────────────────────────────────────────
; Kirim SIGTERM terlebih dahulu, tunggu 10 detik, baru SIGKILL
stopsignal=TERM
stopwaitsecs=10
