; ══════════════════════════════════════════════════════════════════════════════
; Supervisor config — SatuSehat CarePlan Listener Daemon
; ══════════════════════════════════════════════════════════════════════════════
;
; Cara install di production (Ubuntu/Debian):
;   1. sudo cp satusehat-careplan-listener.conf /etc/supervisor/conf.d/
;   2. sudo supervisorctl reread && sudo supervisorctl update
;   3. sudo supervisorctl start satusehat-careplan-listener
;
; Trigger: UPDATE registrasi SET status_dokter = 'Sudah Diperiksa'
; Channel: satusehat_careplan_notify
; ──────────────────────────────────────────────────────────────────────────────

[program:satusehat-careplan-listener]

command=/usr/bin/php /var/www/eye-hospital/artisan satusehat:listen-careplan --timeout=5000 --max-jobs=1000
directory=/var/www/eye-hospital
user=www-data
autostart=true
autorestart=true
startretries=10
startsecs=3

stdout_logfile=/var/log/supervisor/satusehat-careplan-listener.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/satusehat-careplan-listener-error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3

stopsignal=TERM
stopwaitsecs=10
